<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ôn tập Tin học - 300 câu trắc nghiệm</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent2: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
      --correct-bg: rgba(34, 197, 94, 0.15);
      --wrong-bg: rgba(239, 68, 68, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      justify-content: space-between;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .stats {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }
    .stat {
      background: var(--card);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .stat span { font-weight: 700; }
    .stat.correct span { color: var(--accent2); }
    .stat.wrong span { color: var(--danger); }
    .stat.done span { color: var(--accent); }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }
    select, button, input[type="search"] {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 0.9rem;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    select:hover, button:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border: none;
    }
    button.primary:hover { background: #7dd3fc; }
    button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
    button.danger:hover { background: var(--danger); color: white; }
    input[type="search"] {
      min-width: 200px;
      flex: 1;
    }
    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.3s;
    }
    .question-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }
    .question-card.answered-correct { border-color: var(--accent2); }
    .question-card.answered-wrong { border-color: var(--danger); }
    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .q-id {
      background: #0f172a;
      color: var(--accent);
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .q-status {
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
    .q-status.correct { background: var(--correct-bg); color: var(--accent2); }
    .q-status.wrong { background: var(--wrong-bg); color: var(--danger); }
    .q-status.unanswered { color: var(--muted); }
    .q-text {
      font-size: 1.05rem;
      margin-bottom: 1.25rem;
      font-weight: 500;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .option:hover:not(.disabled) {
      border-color: var(--accent);
      background: #1e293b;
    }
    .option.selected {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }
    .option.correct-answer {
      border-color: var(--accent2);
      background: var(--correct-bg);
    }
    .option.wrong-answer {
      border-color: var(--danger);
      background: var(--wrong-bg);
    }
    .option.disabled { cursor: default; opacity: 0.95; }
    .opt-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .option.correct-answer .opt-letter { background: var(--accent2); color: #0f172a; }
    .option.wrong-answer .opt-letter { background: var(--danger); color: white; }
    .option.selected .opt-letter { background: var(--accent); color: #0f172a; }
    .nav-btns {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    .mode-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .mode-toggle button.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }
    .list-view .question-card { cursor: pointer; }
    .list-view .options { display: none; }
    .list-view .question-card.expanded .options { display: flex; }
    footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .empty {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.1rem; }
      .stats { font-size: 0.8rem; }
      main { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>📚 Ôn tập Tin học · 300 câu</h1>
      <div class="stats">
        <div class="stat done">Đã làm: <span id="stat-done">0</span>/300</div>
        <div class="stat correct">Đúng: <span id="stat-correct">0</span></div>
        <div class="stat wrong">Sai: <span id="stat-wrong">0</span></div>
      </div>
    </div>
  </header>

  <main>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>

    <div class="controls">
      <div class="mode-toggle">
        <button id="btn-quiz" class="active" onclick="setMode('quiz')">Chế độ làm bài</button>
        <button id="btn-list" onclick="setMode('list')">Danh sách</button>
      </div>
      <select id="filter-section" onchange="applyFilter()">
        <option value="">Tất cả phần</option>
      </select>
      <input type="search" id="search" placeholder="Tìm theo mã hoặc nội dung..." oninput="applyFilter()" />
      <button onclick="shuffleQuestions()">🔀 Xáo trộn</button>
      <button class="danger" onclick="resetProgress()">🗑 Xóa tiến độ</button>
    </div>

    <div id="quiz-area">
      <div id="question-container"></div>
      <div class="nav-btns" id="nav-btns">
        <button onclick="prevQ()">← Trước</button>
        <button class="primary" onclick="nextQ()">Tiếp →</button>
        <button onclick="jumpUnanswered()">Câu chưa làm</button>
        <button onclick="showAnswer()">Hiện đáp án</button>
      </div>
    </div>
  </main>

  <footer>
    Dữ liệu từ bộ câu hỏi trắc nghiệm Tin học · Tiến độ được lưu tự động trên trình duyệt (localStorage)
  </footer>

  <script>
    // ============ DATA (300 questions) ============
    const QUESTIONS = [{"id":"A.I.1","question":"GUI cho phép giao tiếp với máy tính bằng hình ảnh và chữ viết. GUI là viết tắt của từ nào?","options":["Graphical User Interface.","Graphics User Interaction.","Good User Interface.","Great User Interface."],"correct":0},{"id":"A.I.2","question":"Phát biểu nào sau đây là đúng về bộ nhớ RAM?","options":["Cho phép đọc ghi xoá thông tin.","Không thể nâng cấp.","Khi mất điện dữ liệu trong RAM không bị mất.","Hệ thống vẫn hoạt động khi thiếu RAM."],"correct":0},{"id":"A.I.3","question":"ROM là từ viết tắt của từ nào?","options":["Read Only Memory.","Resources Of Memory.","Random Only Memory.","Random Output Measure."],"correct":0},{"id":"A.I.4","question":"Ta không thể gõ phím số ở vùng phím số chuyên dụng là bởi vì?","options":["Chưa nhấn phím Num Lock trên bàn phím.","Chưa nhấn phím Scroll Lock trên bàn phím.","Chưa nhấn phím Pause / Break trên bàn phím.","Chưa nhấn phím Caps Lock trên bàn phím."],"correct":0},{"id":"A.I.5","question":"Virus máy tính là gì?","options":["Là một chương trình máy tính.","Chỉ hoạt động khi phần mềm bị sao chép trái phép.","Là phần cứng chỉ phá hoại các phần khác.","Là một loại nấm mốc trên bề mặt đĩa."],"correct":0},{"id":"A.I.6","question":"Firmware là gì?","options":["Được lập trình và được nhúng vào trong một thiết bị phần cứng.","Một mã số nhận dạng mà nhà cung cấp sản phẩm gắn vào linh kiện phần cứng.","Một bảo hành được cung cấp với một thiết bị phần cứng.","Một tên gọi khác cho phần cứng đặc biệt nhỏ như một linh kiện."],"correct":0},{"id":"A.I.7","question":"Theo bạn, các phần mềm sau thuộc nhóm phần mềm nào: MS Word, MS Excel, MS PowerPoint?","options":["Nhóm phần mềm ứng dụng.","Nhóm phần mềm hệ thống.","Nhóm phần mềm CSDL.","Nhóm phần mềm hệ điều hành."],"correct":0},{"id":"A.I.8","question":"Trình tự xử lý thông tin của máy tính điện tử như thế nào?","options":["Nhập thông tin → Xử lý thông tin → Xuất thông tin.","Màn hình → CPU → Đĩa cứng.","Đĩa cứng → Màn hình → CPU.","Màn hình → Máy in → CPU."],"correct":0},{"id":"A.I.9","question":"Phát biểu nào đúng?","options":["Hai máy tính vẫn có thể kết nối với nhau mà không quan tâm đến khoảng cách địa lý là bao xa.","Các máy tính gần nhau mặc định sẽ thấy nhau dù không cùng lớp mạng.","Nếu chỉ có một máy tính thì nó không thể chia sẽ dữ liệu.","Máy khác có thể thay đổi các tập tin chia sẽ khi chưa được phép."],"correct":0},{"id":"A.I.10","question":"Tường lửa là gì?","options":["Kiểm soát lưu thông dữ liệu giữa 2 vùng có độ tin cậy khác nhau trên mạng.","Là sự kết hợp của một phần mềm và một thiết bị phần cứng.","Có thể dùng để chặn các truy cập hợp pháp đến một thiết bị/dịch vụ.","Là một thuật ngữ ám chỉ máy tính không còn an toàn nữa."],"correct":0},{"id":"A.II.1","question":"My Computer không có chức năng nào dưới đây?","options":["Quản lý Virus.","Quản lý ổ đĩa, mạng.","Quản lý máy in.","Quản lý Control Panel."],"correct":0},{"id":"A.II.2","question":"Khái niệm Desktop là gì?","options":["Là màn hình xuất hiện đầu tiên sau khi Windows khởi động xong.","Là màn hình đăng nhập.","Là màn hình để chỉnh sửa các thành phần của Windows.","Là màn hình đầu tiên xuất hiện khi cài đặt một phần mềm."],"correct":0},{"id":"A.II.3","question":"Hệ điều hành là gì?","options":["Một chương trình chạy trên máy tính dùng quản lý điều hành máy tính.","Một chương trình chạy trên máy tính như các chương trình khác.","Một thiết bị gắn thêm vào máy tính để quản lý điều hành máy tính.","Chính là máy tính."],"correct":0},{"id":"A.II.4","question":"Tệp tin có phần mở rộng là EXE cho ta biết đây là loại tệp tin gi?","options":["File thực thi.","File ảnh.","File văn bản.","File âm thanh."],"correct":0},{"id":"A.II.5","question":"Quá trình Hibernate trong máy tính nghĩa là gì?","options":["Lưu các trạng thái hiện thời của các ứng dụng đang mở vào ổ cứng và đặt máy tính vào trạng thái tắt hoàn toàn.","Đặt máy vào trạng thái chờ đợi và hoạt động trở lại khi bấm nút trên bàn phím hoặc chuột.","Đặt máy tính vào trạng thái t     // ============ STATE ============
    const STORAGE_KEY = 'tin_hoc_quiz_progress_v1';
    let answers = {}; // { id: selectedIndex }
    let currentIndex = 0;
    let filtered = [...QUESTIONS];
    let mode = 'quiz'; // quiz | list
    let shuffledOrder = null;

    // ============ INIT ============
    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          answers = data.answers || {};
          currentIndex = data.currentIndex || 0;
        }
      } catch (e) {}
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          answers,
          currentIndex,
          updated: new Date().toISOString()
        }));
      } catch (e) {}
    }

    function buildSectionFilter() {
      const sections = new Set();
      QUESTIONS.forEach(q => {
        const m = q.id.match(/^([A-F]\.[IVX]+)/);
        if (m) sections.add(m[1]);
        else sections.add(q.id.split('.')[0]);
      });
      const sel = document.getElementById('filter-section');
      [...sections].sort().forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        sel.appendChild(opt);
      });
    }

    // ============ STATS ============
    function updateStats() {
      let correct = 0, wrong = 0, done = 0;
      QUESTIONS.forEach(q => {
        if (answers[q.id] !== undefined) {
          done++;
          if (answers[q.id] === q.correct) correct++;
          else wrong++;
        }
      });
      document.getElementById('stat-done').textContent = done;
      document.getElementById('stat-correct').textContent = correct;
      document.getElementById('stat-wrong').textContent = wrong;
      document.getElementById('progress').style.width = (done / QUESTIONS.length * 100) + '%';
    }

    // ============ FILTER / SEARCH ============
    function applyFilter() {
      const section = document.getElementById('filter-section').value;
      const search = document.getElementById('search').value.trim().toLowerCase();
      filtered = QUESTIONS.filter(q => {
        if (section && !q.id.startsWith(section)) return false;
        if (search && !q.id.toLowerCase().includes(search) && !q.question.toLowerCase().includes(search)) return false;
        return true;
      });
      if (shuffledOrder) {
        // keep relative order of filtered
        const set = new Set(filtered.map(q => q.id));
        filtered = shuffledOrder.filter(q => set.has(q.id));
      }
      currentIndex = 0;
      render();
    }

    function shuffleQuestions() {
      shuffledOrder = [...QUESTIONS].sort(() => Math.random() - 0.5);
      applyFilter();
    }

    // ============ RENDER ============
    function render() {
      updateStats();
      if (mode === 'quiz') renderQuiz();
      else renderList();
    }

    function renderQuiz() {
      document.getElementById('nav-btns').style.display = 'flex';
      const container = document.getElementById('question-container');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty">Không có câu hỏi phù hợp.</div>';
        return;
      }
      if (currentIndex >= filtered.length) currentIndex = filtered.length - 1;
      if (currentIndex < 0) currentIndex = 0;
      const q = filtered[currentIndex];
      const selected = answers[q.id];
      const isAnswered = selected !== undefined;
      const isCorrect = isAnswered && selected === q.correct;

      let statusHtml = '';
      if (isAnswered) {
        statusHtml = isCorrect
          ? '<span class="q-status correct">✓ Đúng</span>'
          : '<span class="q-status wrong">✗ Sai</span>';
      } else {
        statusHtml = '<span class="q-status unanswered">Chưa trả lời</span>';
      }

      let optionsHtml = q.options.map((opt, i) => {
        let cls = 'option';
        if (isAnswered) {
          cls += ' disabled';
          if (i === q.correct) cls += ' correct-answer';
          if (i === selected && selected !== q.correct) cls += ' wrong-answer';
        } else if (selected === i) {
          cls += ' selected';
        }
        const letter = String.fromCharCode(65 + i);
        return `<div class="${cls}" data-idx="${i}" onclick="selectOption('${q.id}', ${i})">
          <div class="opt-letter">${letter}</div>
          <div>${escapeHtml(opt)}</div>
        </div>`;
      }).join('');

      container.innerHTML = `
        <div class="question-card ${isAnswered ? (isCorrect ? 'answered-correct' : 'answered-wrong') : ''}">
          <div class="q-header">
            <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
              <span class="q-id">${q.id}</span>
              <span style="color:var(--muted);font-size:0.9rem">Câu ${currentIndex + 1}/${filtered.length}</span>
            </div>
            ${statusHtml}
          </div>
          <div class="q-text">${escapeHtml(q.question)}</div>
          <div class="options">${optionsHtml}</div>
        </div>
      `;
      saveProgress();
    }

    function renderList() {
      document.getElementById('nav-btns').style.display = 'none';
      const container = document.getElementById('question-container');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty">Không có câu hỏi phù hợp.</div>';
        return;
      }
      container.innerHTML = filtered.map((q, idx) => {
        const selected = answers[q.id];
        const isAnswered = selected !== undefined;
        const isCorrect = isAnswered && selected === q.correct;
        let statusHtml = isAnswered
          ? (isCorrect ? '<span class="q-status correct">✓</span>' : '<span class="q-status wrong">✗</span>')
          : '<span class="q-status unanswered">○</span>';
        return `
          <div class="question-card list-view ${isAnswered ? (isCorrect ? 'answered-correct' : 'answered-wrong') : ''}" 
               onclick="toggleExpand(this)" data-id="${q.id}">
            <div class="q-header">
              <div style="display:flex;gap:0.5rem;align-items:center">
                <span class="q-id">${q.id}</span>
                ${statusHtml}
              </div>
            </div>
            <div class="q-text">${escapeHtml(q.question)}</div>
            <div class="options">
              ${q.options.map((opt, i) => {
                let cls = 'option disabled';
                if (isAnswered) {
                  if (i === q.correct) cls += ' correct-answer';
                  if (i === selected && selected !== q.correct) cls += ' wrong-answer';
                }
                return `<div class="${cls}"><div class="opt-letter">${String.fromCharCode(65+i)}</div><div>${escapeHtml(opt)}</div></div>`;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleExpand(el) {
      el.classList.toggle('expanded');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ============ ACTIONS ============
    function selectOption(id, idx) {
      if (answers[id] !== undefined) return; // already answered
      answers[id] = idx;
      saveProgress();
      render();
    }

    function nextQ() {
      if (currentIndex < filtered.length - 1) {
        currentIndex++;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function prevQ() {
      if (currentIndex > 0) {
        currentIndex--;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function jumpUnanswered() {
      const start = currentIndex;
      for (let i = 0; i < filtered.length; i++) {
        const idx = (start + 1 + i) % filtered.length;
        if (answers[filtered[idx].id] === undefined) {
          currentIndex = idx;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
      }
      alert('Bạn đã làm hết các câu trong bộ lọc hiện tại!');
    }

    function showAnswer() {
      const q = filtered[currentIndex];
      if (!q) return;
      if (answers[q.id] === undefined) {
        // mark as shown but not counted? just reveal
        answers[q.id] = -1; // special: revealed without choosing
        // better: force select correct temporarily? No, just re-render with reveal
      }
      // Force show by temporarily setting if not answered
      const was = answers[q.id];
      if (was === undefined) answers[q.id] = q.correct; // auto mark correct? No, user asked show
      // Better approach: always allow show by adding a flag, but simple: set to correct and note
      answers[q.id] = q.correct;
      saveProgress();
      render();
    }

    function setMode(m) {
      mode = m;
      document.getElementById('btn-quiz').classList.toggle('active', m === 'quiz');
      document.getElementById('btn-list').classList.toggle('active', m === 'list');
      render();
    }

    function resetProgress() {
      if (!confirm('Bạn chắc chắn muốn xóa toàn bộ tiến độ đã lưu?')) return;
      answers = {};
      currentIndex = 0;
      saveProgress();
      render();
    }

    // ============ START ============
    loadProgress();
    buildSectionFilter();
    applyFilter();
  </script>
